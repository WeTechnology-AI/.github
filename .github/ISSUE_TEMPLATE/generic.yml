name: Issue generica
description: Segnalazione o richiesta generica
title: "[Issue]: "
projects: ["WeTechnology-AI/5"]
labels: []
body:
  - type: textarea
    id: descrizione
    attributes:
      label: Descrizione
      description: Cosa serve o cosa non funziona?
    validations:
      required: true
  - type: textarea
    id: contesto
    attributes:
      label: Contesto
      description: Link, screenshot, riferimenti utili
  - type: input
    id: giorni
    attributes:
      label: Stima (giorni)
      description: Solo per i task di sviluppo, facoltativa. Giorni lavorativi che servono, anche mezze giornate (es. 3 o 0,5). È la stessa stima del campo Giorni della board del progetto, e si può aggiungere dopo.
